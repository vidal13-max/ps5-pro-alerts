
name: PS5 Pro stock monitor

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test notification'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ps5-pro-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Check stock or send test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if [ "$TEST_ALERT" = 'true' ]; then
            python ps5_pro_monitor.py --test-alert
          else
            python ps5_pro_monitor.py --once
          fi
